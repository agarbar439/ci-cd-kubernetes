apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: dev-rhombus
  labels:
    app: rhombus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rhombus
  template:
    metadata:
      labels:
        app: rhombus
    spec:
      containers:
      - name: contenedor-rhombus
        image: pedid251/rhombus-color
        ports:
        - containerPort: 80
        envFrom:
          - secretRef:
              name: mysql-pass
---
apiVersion: v1
kind: Service
metadata:
  name: rhombus
  namespace: dev-rhombus
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30007
  selector:
    app: rhombus